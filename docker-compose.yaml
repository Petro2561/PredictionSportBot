networks:
  psb_net:
    driver: bridge
    enable_ipv6: false

services:
  postgres:
    image: postgres:15
    container_name: psb-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: bonds_bot
      POSTGRES_USER: tg_user
      POSTGRES_PASSWORD: tg_pass
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "superuser_reserved_connections=5"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - psb_net

  redis:
    image: redis:latest
    container_name: psb-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"    
    volumes:
      - ./redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - psb_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-bot
    restart: unless-stopped
    # На Timeweb bridge не маршрутизирует наружу; host network = как curl с хоста
    network_mode: host
    working_dir: /app
    depends_on:
      - postgres
      - redis
    command: python main.py
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16379
      DATABASE_URL: postgresql+asyncpg://tg_user:tg_pass@127.0.0.1:15432/bonds_bot
      WEBAPP_PORT: 8082
      WEBAPP_URL: ${WEBAPP_URL}

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-admin
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8081"
    depends_on:
      - postgres
      - redis
    command: >
      python -m uvicorn admin.main:app --host 0.0.0.0 --port 8081
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tg_user:tg_pass@postgres:5432/bonds_bot
    networks:
      - psb_net